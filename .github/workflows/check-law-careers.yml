name: Update law vacancies and publish Career Atlas
on:
  workflow_dispatch:
  schedule:
    # 08:23 Dubai time (04:23 UTC); hosted runners may start late.
    - cron: '23 4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: law-career-atlas-vacancies
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run automated job-feed and reconciliation tests
        run: python -m unittest discover -s tests -v
      - name: Collect individual official legal vacancies
        run: python scripts/collect_jobs.py
      - name: Rebuild public site with the latest vacancy snapshot
        run: python scripts/build_site.py
      - name: Commit public vacancy database and site
        shell: bash
        run: |
          git config user.name 'law-career-atlas-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live_jobs.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified law vacancy records'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Summarize findings and send optional GitHub Issues alerts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/notify_issues.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the refreshed website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish the refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
